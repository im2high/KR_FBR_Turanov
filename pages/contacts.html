<!DOCTYPE html>

<body class="bg-light">
    <div class="container-fluid p-0">
        <!-- Header -->
        <header class="bg-primary text-white py-4">

                    </div>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">

                        <li class="nav-item">

                    </ul>
                </div>
            </div>
        </nav>

            <main class="contacts">
                <section class="contacts__list">
                    <h2 class="conctacts__title">Свяжитесь со мной</h2>
                    <article class="contacts">
                            <label for="name">Имя <span class="required">*</span></label>
                            <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
                        </div>
                        <div class="form-group">
                            <label for="email">Электронная почта <span class="required">*</span></label>
                            <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                        </div>
                         <div class="form-group">
                            <label for="message">Текст обращения <span class="required">*</span></label>
                            <textarea id="message" name="message" required placeholder="Опишите вашу проблему или вопрос..."></textarea>
                        </div>
                         <button type="button" class="btn btn-primary" onclick="submitForm()">Отправить</button>
                    </article>
                </section>
            </main>
<div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <div class="card h-100">
                                    <div class="card-body">
                                        <h5 class="card-title">Контакты</h5>
                                        <p class="card-text small text-muted">
                                            📧 nya@gmail.com
                                        </p>

                </div>
            </div>
