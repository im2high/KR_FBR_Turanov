<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - StudentDev Portfolio</title>
    <link rel="stylesheet" href="/style/styles.css">
</head>

<body>
    <div class="page">
        <!-- Header -->
        <header class="header">
            <div class="container">
                <div class="header__content">
                    <h1 class="header__title">Туранов Илья</h1>
                    <p class="header__subtitle">Студент-разработчик</p>
                </div>
            </div>
        </header>
        
        <!-- Navigation -->
        <nav class="nav">
            <div class="container">
                <ul class="nav__list">
                    <li class="nav__item">
                        <a href="/index.html" class="nav__link">Главная</a>
                    </li>
                    <li class="nav__item">
                        <a href="practices.html" class="nav__link">Проекты</a>
                    </li>
                    <li class="nav__item">
                        <a href="goods.html" class="nav__link">Дневник</a>
                    </li>
                    <li class="nav__item nav__item--active">
                        <a href="contacts.html" class="nav__link">Контакты</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main">
            <div class="container">
                <h3 class="section-title">Свяжитесь со мной</h3>
                
                <div class="contacts__content">
                    <!-- Contact Form -->
                    <section class="contact-form">
                        <form class="form">
                            <div class="form__group">
                                <label class="form__label" for="name">
                                    Имя <span class="required">*</span>
                                </label>
                                <input type="text" id="name" name="name" class="form__input" required placeholder="Введите ваше имя">
                            </div>
                            
                            <div class="form__group">
                                <label class="form__label" for="email">
                                    Электронная почта <span class="required">*</span>
                                </label>
                                <input type="email" id="email" name="email" class="form__input" required placeholder="example@mail.ru">
                            </div>
                            
                            <div class="form__group">
                                <label class="form__label" for="message">
                                    Текст обращения <span class="required">*</span>
                                </label>
                                <textarea id="message" name="message" class="form__textarea" required placeholder="Опишите вашу проблему или вопрос..."></textarea>
                            </div>
                            
                            <button type="button" class="button button--primary form__button" onclick="submitForm()">
                                Отправить
                            </button>
                        </form>
                    </section>

                    <!-- Contact Info -->
                    <section class="contact-info">
                        <h4 class="contact-info__title">Контакты</h4>
                        <div class="contact-info__items">
                            <div class="contact-item">
                                <div class="contact-item__icon">📧</div>
                                <div class="contact-item__content">
                                    <h5 class="contact-item__title">Email</h5>
                                    <p class="contact-item__value">nya@gmail.com</p>
                                </div>
                            </div>
                            
                            <div class="contact-item">
                                <div class="contact-item__icon">📱</div>
                                <div class="contact-item__content">
                                    <h5 class="contact-item__title">GitHub</h5>
                                    <p class="contact-item__value">im2high</p>
                                </div>
                            </div>
                            
                            <div class="contact-item">
                                <div class="contact-item__icon">📍</div>
                                <div class="contact-item__content">
                                    <h5 class="contact-item__title">Местоположение</h5>
                                    <p class="contact-item__value">Москва, Россия</p>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <div class="footer__content">
                    <p class="footer__copyright">&copy; 2025 StudentDev Portfolio</p>
                    <div class="footer__links">
                        <a href="mailto:student@edu.ru" class="footer__link">student@edu.ru</a>
                        <a href="https://github.com" class="footer__link">GitHub</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        function submitForm() {
            // Базовая валидация формы
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            
            if (!name || !email || !message) {
                alert('Пожалуйста, заполните все обязательные поля');
                return;
            }
            
            alert('Сообщение отправлено! Спасибо за обращение.');
            
            // Очистка формы
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('message').value = '';
        }
    </script>
</body>

</html>
